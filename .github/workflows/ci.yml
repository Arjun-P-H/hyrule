name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  engine-ci:
    name: Engine Test, Typecheck, Quality Gate, Benchmark & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # pinned: bench numbers and bun test behaviour are version-sensitive

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Strict Typecheck (Phase 6 Gate)
        run: bunx tsc --noEmit

      - name: Unit & Dual-Twin Parity Tests
        run: bun test

      - name: Quality Gate — circular deps, dead exports, coverage (Phase 5/6 Gate)
        run: bun run quality

      # Smoke run of the CPU/allocation harness. A/B against the pinned Phase 0
      # revision needs full git history and the reference machine, so CI runs
      # the working tree alone; GPU suites need a real GPU and run locally.
      - name: CPU & Allocation Benchmark (smoke)
        run: bun run bench --cpu-only --against=none

      - name: Production Bundle Build (Phase 5 Gate)
        run: bun run build
